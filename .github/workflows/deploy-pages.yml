name: Refresh and deploy weekly site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "assets/**"
      - "data/latest_research.csv"
      - "requirements.txt"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
  workflow_dispatch:
  schedule:
    # 07:00 UTC is 08:00 CET or 09:00 CEST in Europe/Ljubljana.
    - cron: "0 7 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh universe and financial data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HF_DATA_API_KEY: ${{ secrets.HF_DATA_API_KEY }}
        run: |
          if [ -z "$HF_DATA_API_KEY" ]; then
            echo "::error::Add HF_DATA_API_KEY as a repository Actions secret before running a scheduled or manual refresh."
            exit 1
          fi
          python scripts/update_universe.py
          python scripts/update_snapshot.py
          python scripts/update_prices.py
          python scripts/build_screen.py
          python scripts/rank_companies.py
          python scripts/build_research_notes.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build static site
        run: python scripts/build_site.py

      - name: Save refreshed weekly outputs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe.csv data/*.csv docs
          if git diff --cached --quiet; then
            echo "No refreshed outputs changed."
          else
            git commit -m "chore: refresh weekly stock data [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
