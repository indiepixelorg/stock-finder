name: Refresh and deploy weekly site

on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC is 08:00 CET or 09:00 CEST in Europe/Ljubljana.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh universe and financial data
        env:
          HF_DATA_API_KEY: ${{ secrets.HF_DATA_API_KEY }}
        run: |
          if [ -z "$HF_DATA_API_KEY" ]; then
            echo "::error::Add HF_DATA_API_KEY as a repository Actions secret before running a scheduled or manual refresh."
            exit 1
          fi
          python scripts/update_universe.py
          python scripts/update_snapshot.py
          python scripts/update_prices.py
          python scripts/build_screen.py
          python scripts/rank_companies.py
          python scripts/build_research_notes.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: generated/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
